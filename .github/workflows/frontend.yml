name: Frontend build check
on:
  push:
    paths: ['src/**', 'assets/frontend/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'vite.config.js', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['src/**', 'assets/frontend/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'vite.config.js', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify committed bundle
        run: git diff --exit-code -- assets/frontend/
